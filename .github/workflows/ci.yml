name: macOS verification

on:
  push:
  pull_request:

concurrency:
  group: mcv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Debug build
        run: swift build
      - name: Deterministic runtime tests
        # Hosted runners have no reliable interactive WindowServer; WKWebView
        # behavior suites are exercised on a logged-in macOS session locally.
        run: swift test --filter ExtensionRuntimeTests
      - name: Release app
        run: make app
      - name: Verify bundle signature
        run: codesign --verify --deep --strict "MCV Browser.app"
